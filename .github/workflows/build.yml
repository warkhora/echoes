name: Desktop builds
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Echoes-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        shell: bash
        run: |
          for file in dist/*.exe dist/*.dmg; do
            [ -f "$file" ] || continue
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done
        # Release uploads require contents: write. Tag pushes only build artifacts;
        # publishing a GitHub release uploads those assets.
        continue-on-error: false
    permissions:
      contents: write
